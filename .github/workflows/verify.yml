# Step 14 — CI. Runs the six offline gates on every push/PR.
# INTENTIONALLY EXCLUDES `npm run verify:live`: that probe needs real
# production Supabase credentials and must stay a manual pre-deploy step —
# no production secrets belong in this project's CI.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # >=22.18: node --test runs the TypeScript suite via native type
          # stripping (zero test deps — the project's standing doctrine).
          node-version: ">=22.18.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Offline gate: spins up an in-memory PGlite Postgres — no env vars,
      # no network, no secrets required. Safe on a fresh clone.
      - name: DB gate (offline)
        run: npm run verify:db

      # Offline gate: builds the generated PDFs (including hostile inputs)
      # and reads every one back — structure, margins, page furniture,
      # content. No env, no network, no browser.
      - name: PDF gate (offline)
        run: npm run verify:pdf
